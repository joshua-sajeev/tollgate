services:
  redis:
    image: redis:8-alpine
    container_name: redis_rate_limiter
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      - REDIS_ARGS=--requirepass "${REDIS_PASSWORD}" --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data

volumes:
  redis_data:
